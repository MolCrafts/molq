name: test

# pytest in two tiers (`test / context` decides, through MolCrafts/molcrafts-ci/actions/ci-context):
#
#   fast  a feature-branch push to MolCrafts: Linux, Python 3.12.
#   full  every push to a fork (proven before its pull request), dev, master
#         and main on MolCrafts, pull requests, tags and dispatches:
#         Linux and macOS (molq is POSIX-only) on the oldest and newest
#         Python.
#
# `test / package` checks the built wheel in both tiers.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# One group per file, workflow, event and ref. Under workflow_call (release.yml
# running lint/test) github.workflow and github.event_name are the caller's, so
# a called run never shares, and so never cancels, a direct run's group.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master","refs/heads/main"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Where this run happens, decided once: MolCrafts/molcrafts-ci/actions/ci-context.
  context:
    name: test / context
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.context.outputs.tier }}
      upstream: ${{ steps.context.outputs.upstream }}
      integration: ${{ steps.context.outputs.integration }}
      skip-pr: ${{ steps.context.outputs.skip-pr }}
      publish: ${{ steps.context.outputs.publish }}
    steps:
      - id: context
        uses: MolCrafts/molcrafts-ci/actions/ci-context@master

  python:
    name: test / python (${{ matrix.os }}, ${{ matrix.python }})
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.context.outputs.tier == 'full' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
        python: ${{ fromJSON(needs.context.outputs.tier == 'full' && '["3.12","3.13"]' || '["3.12"]') }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@master
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --extra dev
      - run: uv run pytest -q

  # pytest imports from src/, so a packaging config that silently drops a
  # module would still go green and ship a broken wheel. This job only ever
  # touches the built artifact.
  package:
    name: test / package
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@master
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Install the wheel into a clean environment
        run: |
          uv venv /tmp/wheelcheck
          uv pip install --python /tmp/wheelcheck dist/*.whl
      - name: Import every subpackage from the wheel
        # Run outside the checkout so src/ cannot satisfy these imports.
        working-directory: /tmp
        run: |
          /tmp/wheelcheck/bin/python - <<'PY'
          import importlib

          # One entry per module that must survive packaging. A subpackage
          # missing from the wheel fails here rather than on a user's machine.
          modules = [
              "molq",
              "molq.cli._app", "molq.cli._helpers", "molq.cli.jobs",
              "molq.cli.main", "molq.cli.maintenance", "molq.cli.setup",
              "molq.scheduler", "molq.scheduler.base", "molq.scheduler.script",
              "molq.scheduler.shell", "molq.scheduler.slurm",
              "molq.scheduler.pbs", "molq.scheduler.lsf",
              "molq.store", "molq.store.jobstore", "molq.store.records",
              "molq.store.schema",
              "molq.plugins.nerve",
              "molq.artifacts", "molq.dependencies", "molq.handle",
              "molq.jobpaths", "molq.retention", "molq.retry",
              "molq.validation", "molq.workspace", "molq.dashboard",
          ]
          for name in modules:
              importlib.import_module(name)

          import molq
          assert molq.__all__, "public surface is empty"
          for name in molq.__all__:
              getattr(molq, name)  # includes the lazily-exported dashboard names
          print(f"{len(modules)} modules, {len(molq.__all__)} public names OK")
          PY
      - name: Run a real job through the installed console script
        working-directory: /tmp
        env:
          MOLCRAFTS_HOME: /tmp/wheelcheck-home
        run: |
          /tmp/wheelcheck/bin/molq --version
          /tmp/wheelcheck/bin/molq --help > /dev/null
          /tmp/wheelcheck/bin/molq submit local --block echo packaged
          /tmp/wheelcheck/bin/molq list local --all
