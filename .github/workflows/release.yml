name: release

# A v* tag re-runs lint and the tests on the tagged tree, checks the tag
# against pyproject.toml, builds, and publishes to PyPI (trusted publishing,
# MolCrafts only). workflow_dispatch is the dry run: everything but the upload.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One group per file, workflow, event and ref; a release is never cancelled.
concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Where this run happens, decided once: MolCrafts/molcrafts-ci/actions/ci-context.
  context:
    name: release / context
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.context.outputs.tier }}
      upstream: ${{ steps.context.outputs.upstream }}
      integration: ${{ steps.context.outputs.integration }}
      skip-pr: ${{ steps.context.outputs.skip-pr }}
      publish: ${{ steps.context.outputs.publish }}
    steps:
      - id: context
        uses: MolCrafts/molcrafts-ci/actions/ci-context@master

  lint:
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    uses: ./.github/workflows/lint.yml

  test:
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    uses: ./.github/workflows/test.yml

  build:
    name: release / build
    needs: [context, lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@master
      - name: Tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(uv version --short)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject version ${version}"
            exit 1
          fi
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    name: release / pypi
    needs: [context, build]
    # A `v*` tag on MolCrafts, and nothing else: actions/ci-context decides.
    if: needs.context.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
