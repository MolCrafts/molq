# Managed by prek: `prek install`
# CI parity: same shell commands as .github/workflows/ci.yml (no tox wrapper).
# tox remains in [project.optional-dependencies] dev for optional local isolation.

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: check-toml
      - id: check-json
        # devcontainer.json is JSONC by specification — the devcontainer
        # schema permits comments, and this one uses them. A strict JSON
        # parser is simply the wrong tool for it.
        exclude: ^\.devcontainer/

  - repo: local
    hooks:
      - id: ci-lint
        name: "CI lint (same as ci.yml)"
        entry: bash -c 'uv sync --extra dev && uv run ruff check src tests && uv run ruff format --check src tests && uv run ty check src/'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: ci-test
        name: "CI test (same as ci.yml)"
        entry: bash -c 'uv sync --extra dev && uv run pytest -q --cov=molq --cov-report=xml'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
